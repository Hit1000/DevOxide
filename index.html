<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-dark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Oxide</title>
    <script>
      // Apply theme before React mounts to avoid flash of wrong theme
      (function() {
        try {
          // Tauri store is async, so we optimistically apply 'dark' as default.
          // The store hook will correct it within the first frame after mount.
          document.documentElement.classList.add('dark');
        } catch(e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
